<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Integrado de Diseño Estructural</title>
    <style>
        * { box-sizing:border-box; margin:0; padding:0; font-family:'Inter','Segoe UI',system-ui,-apple-system,Roboto,sans-serif; }
        body { background:#0f1318; color:#e8ecf1; height:100vh; overflow:hidden; display:flex; flex-direction:column; }
        header { background:#171c23; padding:0 24px; border-bottom:1px solid #2c3542; display:flex; align-items:center; gap:32px; height:54px; box-shadow:0 2px 14px rgba(0,0,0,.4); z-index:5; }
        header .titulo { font-size:1rem; font-weight:700; color:#e8ecf1; display:flex; align-items:center; gap:10px; letter-spacing:.2px; }
        header .titulo::before { content:''; width:10px; height:22px; border-radius:3px; background:#e0b13a; }
        nav { display:flex; gap:4px; height:100%; align-items:flex-end; }
        nav button { background:transparent; color:#8b97a7; border:none; border-bottom:3px solid transparent; padding:0 18px; height:100%; font-size:.88rem; font-weight:500; cursor:pointer; transition:.15s; }
        nav button:hover { color:#e8ecf1; background:rgba(255,255,255,.03); }
        nav button.activo { color:#e0b13a; border-bottom-color:#e0b13a; font-weight:700; }
        .vista { display:none; flex:1; height:calc(100vh - 54px); width:100%; }
        .vista.activa { display:flex; }
        .panel-iframe { flex:1; border:none; height:100%; background:#0f1318; }
        .divisor { width:6px; background:#171c23; border-left:1px solid #2c3542; border-right:1px solid #2c3542; cursor:ew-resize; transition:background .15s; }
        .divisor:hover { background:#e0b13a; }
    </style>
</head>
<body>

    <header>
        <div class="titulo">Diseño de Estructuras de Hormigón Armado</div>
        <nav>
            <button id="tab-diseno" class="activo" onclick="mostrarVista('diseno')">Entorno y Definiciones</button>
            <button id="tab-calculos" onclick="mostrarVista('calculos')">Cálculos</button>
            <button id="tab-informe" onclick="mostrarVista('informe')">Informe PDF</button>
        </nav>
    </header>

    <!-- Vista 1: Entorno gráfico + Definiciones del sistema -->
    <div id="vista-diseno" class="vista activa">
        <iframe id="iframe-grafico" class="panel-iframe" src="InterfazGrafico.html"></iframe>
        <div class="divisor" id="divisor"></div>
        <iframe id="iframe-sistema" class="panel-iframe" src="DefinicionesSistema.html"></iframe>
    </div>

    <!-- Vista 2: Motor de cálculo (permanece cargado para recalcular automáticamente) -->
    <div id="vista-calculos" class="vista">
        <iframe id="iframe-calculos" class="panel-iframe" src="Calculos.html"></iframe>
    </div>

    <!-- Vista 3: Informe -->
    <div id="vista-informe" class="vista">
        <iframe id="iframe-informe" class="panel-iframe" src="about:blank"></iframe>
    </div>

    <script>
        function mostrarVista(nombre, urlInforme) {
            ['diseno', 'calculos', 'informe'].forEach(v => {
                document.getElementById('vista-' + v).classList.toggle('activa', v === nombre);
                document.getElementById('tab-' + v).classList.toggle('activo', v === nombre);
            });
            if (nombre === 'informe') {
                // Se recarga para tomar siempre los últimos resultados guardados
                document.getElementById('iframe-informe').src = urlInforme || ('Informe.html?t=' + Date.now());
            }
        }

        // Llamada desde Calculos.html: abre el informe y descarga el PDF automáticamente
        function mostrarInforme(auto) {
            mostrarVista('informe', 'Informe.html?' + (auto ? 'auto=1&' : '') + 't=' + Date.now());
        }

        // Divisor redimensionable entre el entorno gráfico y las definiciones
        (function () {
            const div = document.getElementById('divisor'), a = document.getElementById('iframe-grafico'), b = document.getElementById('iframe-sistema'), cont = document.getElementById('vista-diseno');
            let arrastrando = false;
            div.addEventListener('mousedown', () => { arrastrando = true; a.style.pointerEvents = b.style.pointerEvents = 'none'; document.body.style.userSelect = 'none'; });
            window.addEventListener('mouseup', () => { arrastrando = false; a.style.pointerEvents = b.style.pointerEvents = ''; document.body.style.userSelect = ''; });
            window.addEventListener('mousemove', e => {
                if (!arrastrando) return;
                const w = cont.clientWidth, x = Math.min(Math.max(e.clientX, 250), w - 250);
                a.style.flex = 'none'; a.style.width = x + 'px'; b.style.flex = '1';
                try { a.contentWindow.dispatchEvent(new Event('resize')); } catch (err) {}
            });
        })();
    </script>
</body>
</html>
